# yaml-language-server: $schema=./facet-route-config.schema.json

schema_version: 1
config_revision: phase5-runtime-slices-draft-06

runtime_import:
  target_schema: facet
  mode: merge-into-existing

anchors:
  - key: sample
    table: tbl_physical_samples
    key_column: physical_sample_id
    description: Physical-sample anchor using the current runtime anchor key

  - key: dataset
    table: tbl_datasets
    key_column: dataset_id
    description: Dataset anchor

  - key: sites
    table: tbl_sites
    key_column: site_id
    description: Site anchor for representative map-target and site-level composed slices

  - key: analysis_entity
    table: tbl_analysis_entities
    key_column: analysis_entity_id
    description: Analysis-entity anchor for representative composed result and facet slices

paths:
  - key: features_to_sample
    path:
      - table: tbl_features
      - table: tbl_physical_sample_features
      - table: tbl_physical_samples

  - key: methods_to_dataset
    path:
      - table: tbl_methods
      - table: tbl_datasets

  - key: methods_to_sample
    path:
      - include: methods_to_dataset
      - table: tbl_analysis_entities
      - table: tbl_physical_samples

  - key: dataset_to_sample
    path:
      - table: tbl_datasets
      - table: tbl_analysis_entities
      - table: tbl_physical_samples

route_templates:
  - key: feature_type
    source_table: tbl_feature_types
    source_key_column: feature_type_id
    generated_route_key_pattern: feature_type__{anchor}
    anchors:
      sample:
        path:
          - include: features_to_sample
      dataset:
        path:
          - include: features_to_sample
          - table: tbl_analysis_entities
          - table: tbl_datasets

  - key: dataset_methods
    source_table: tbl_dataset_methods
    source_key_column: dataset_method_id
    generated_route_key_pattern: dataset_methods__{anchor}
    anchors:
      sample:
        path:
          - include: methods_to_sample
      dataset:
        path:
          - include: methods_to_dataset

  - key: data_types
    source_table: tbl_data_types
    source_key_column: data_type_id
    generated_route_key_pattern: data_types__{anchor}
    anchors:
      sample:
        path:
          - include: dataset_to_sample
      dataset:
        path:
          - table: tbl_datasets

  - key: dataset_provider
    source_table: tbl_dataset_masters
    source_key_column: master_set_id
    generated_route_key_pattern: dataset_provider__{anchor}
    anchors:
      sample:
        path:
          - include: dataset_to_sample
      dataset:
        path:
          - table: tbl_datasets

  - key: record_types
    source_table: tbl_record_types
    source_key_column: record_type_id
    generated_route_key_pattern: record_types__{anchor}
    anchors:
      sample:
        path:
          - include: methods_to_sample
      dataset:
        path:
          - include: methods_to_dataset

  - key: country
    source_table: facet.site_location_shortcut
    source_key_column: location_id
    generated_route_key_pattern: country__{anchor}
    anchors:
      analysis_entity:
        path:
          - table: tbl_sites
          - table: tbl_sample_groups
          - table: tbl_physical_samples
          - table: tbl_analysis_entities

  - key: sites_polygon
    source_table: tbl_sites
    source_key_column: site_id
    generated_route_key_pattern: sites_polygon__{anchor}
    anchors:
      analysis_entity:
        path:
          - table: tbl_sample_groups
          - table: tbl_physical_samples
          - table: tbl_analysis_entities

  - key: analysis_entity_ages
    source_table: tbl_analysis_entity_ages
    source_key_column: analysis_entity_age_id
    generated_route_key_pattern: analysis_entity_ages__{anchor}
    anchors:
      analysis_entity:
        path:
          - table: tbl_analysis_entities

  - key: sample
    source_table: tbl_physical_samples
    source_key_column: physical_sample_id
    generated_route_key_pattern: sample__{anchor}
    anchors:
      dataset:
        path:
          - table: tbl_analysis_entities
          - table: tbl_datasets
      sites:
        path:
          - table: tbl_sample_groups
          - table: tbl_sites
      analysis_entity:
        path:
          - table: tbl_analysis_entities

  - key: analysis_entity
    source_table: tbl_analysis_entities
    source_key_column: analysis_entity_id
    generated_route_key_pattern: analysis_entity__{anchor}
    anchors:
      dataset:
        path:
          - table: tbl_datasets
      sample:
        path:
          - table: tbl_physical_samples

facets:
  - key: feature_type
    display_title: Feature type
    description: Feature-type facet slice for first YAML-to-facet-schema import
    group_key: others
    type: discrete
    source_table: tbl_feature_types
    category:
      id_expr: tbl_feature_types.feature_type_id
      name_expr: tbl_feature_types.feature_type_name
      data_type: integer
      operator: "="
    sort_expr: tbl_feature_types.feature_type_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    sql:
      mode: inline-template
      contract: discrete
      base_anchor: sample
      body: |
        select
          tbl_feature_types.feature_type_id as category_id,
          tbl_feature_types.feature_type_name as category_name,
          tbl_physical_samples.physical_sample_id as anchor_id
        from tbl_feature_types
        join tbl_features on tbl_features.feature_type_id = tbl_feature_types.feature_type_id
        join tbl_physical_sample_features on tbl_physical_sample_features.feature_id = tbl_features.feature_id
        join tbl_physical_samples on tbl_physical_samples.physical_sample_id = tbl_physical_sample_features.physical_sample_id
    clauses: []
    anchors:
      - anchor: sample
        route: feature_type__sample
      - anchor: dataset
        route: feature_type__dataset

  - key: dataset_methods
    display_title: Dataset methods
    description: Dataset methods
    group_key: space_time
    type: discrete
    source_table: tbl_dataset_methods
    category:
      id_expr: tbl_methods.method_id
      name_expr: tbl_methods.method_name
      data_type: integer
      operator: "="
    sort_expr: tbl_methods.method_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of datasets
      facet_key: result_facet
    clauses: []
    anchors:
      - anchor: sample
        route: dataset_methods__sample
      - anchor: dataset
        route: dataset_methods__dataset

  - key: data_types
    display_title: Data types
    description: Data types
    group_key: others
    type: discrete
    source_table: tbl_data_types
    category:
      id_expr: tbl_data_types.data_type_id
      name_expr: tbl_data_types.data_type_name
      data_type: integer
      operator: "="
    sort_expr: tbl_data_types.data_type_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    clauses: []
    anchors:
      - anchor: sample
        route: data_types__sample
      - anchor: dataset
        route: data_types__dataset

  - key: dataset_provider
    display_title: Dataset provider
    description: Dataset provider
    group_key: space_time
    type: discrete
    source_table: tbl_dataset_masters
    category:
      id_expr: tbl_dataset_masters.master_set_id
      name_expr: tbl_dataset_masters.master_name
      data_type: integer
      operator: "="
    sort_expr: tbl_dataset_masters.master_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    clauses: []
    anchors:
      - anchor: sample
        route: dataset_provider__sample
      - anchor: dataset
        route: dataset_provider__dataset

  - key: record_types
    display_title: Proxy types
    description: Proxy types
    group_key: others
    type: discrete
    source_table: tbl_record_types
    category:
      id_expr: tbl_record_types.record_type_id
      name_expr: tbl_record_types.record_type_name
      data_type: integer
      operator: "="
    sort_expr: tbl_record_types.record_type_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    clauses: []
    anchors:
      - anchor: sample
        route: record_types__sample
      - anchor: dataset
        route: record_types__dataset

  - key: country
    display_title: Countries
    description: The name of the country, at the time of collection, in which the samples were collected
    group_key: space_time
    type: discrete
    source_table: facet.site_location_shortcut
    category:
      id_expr: facet.site_location_shortcut.location_id
      name_expr: facet.site_location_shortcut.location_name
      data_type: integer
      operator: "="
    sort_expr: facet.site_location_shortcut.location_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    clauses:
      - facet.site_location_shortcut.location_type_id=1
    anchors:
      - anchor: analysis_entity
        route: country__analysis_entity

  # Phase 3 Restoration Driver: Geopolygon facet requiring composed facet-content restoration
  - key: sites_polygon
    display_title: Sites (map)
    description: "Geopolygon restoration driver for Phase 3: requires composed facet-content handling for map-result targets"
    group_key: space_time
    type: geopolygon
    source_table: tbl_sites
    category:
      id_expr: tbl_sites.site_id
      name_expr: tbl_sites.site_name
      data_type: integer
      operator: "="
    sort_expr: tbl_sites.site_name
    flags:
      is_applicable: true
      is_default: true
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    clauses: []
    anchors:
      - anchor: analysis_entity
        route: sites_polygon__analysis_entity

  # Phase 3 Restoration Driver: Intersect facet requiring composed facet-content restoration
  - key: analysis_entity_ages
    display_title: Analysis entity ages
    description: "Intersect restoration driver for Phase 3: requires composed facet-content handling for range-intersection matching"
    group_key: space_time
    type: intersect
    source_table: tbl_analysis_entity_ages
    category:
      id_expr: int4range(lower(tbl_analysis_entity_ages.age_range) - 10000, upper(tbl_analysis_entity_ages.age_range) - 10000)
      name_expr: int4range(lower(tbl_analysis_entity_ages.age_range) - 10000, upper(tbl_analysis_entity_ages.age_range) - 10000)
      data_type: int4range
      operator: "&&"
    sort_expr: "1"
    flags:
      is_applicable: true
      is_default: true
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    clauses: []
    anchors:
      - anchor: analysis_entity
        route: analysis_entity_ages__analysis_entity

  # Phase 1 Driver Facets: Retained Result-Shape And Discrete Implementation Drivers

  - key: result_facet
    display_title: Result facet
    description: Retained result-shape facet using constrained template_key for anchor-identity projection
    group_key: result
    type: discrete
    source_table: tbl_physical_samples
    category:
      id_expr: tbl_physical_samples.physical_sample_id
      name_expr: tbl_physical_samples.sample_name
      data_type: integer
      operator: "="
    sort_expr: tbl_physical_samples.sample_name
    flags:
      is_applicable: true
      is_default: false
    template_key: anchor_identity
    clauses: []
    anchors:
      - anchor: sample
        mode: identity
      - anchor: dataset
        route: sample__dataset
      - anchor: sites
        route: sample__sites
      - anchor: analysis_entity
        route: sample__analysis_entity

  - key: family
    display_title: Family
    description: Routed discrete driver for parity-risk proof slice using inline SQL template
    group_key: taxonomy
    type: discrete
    source_table: tbl_taxa_tree_families
    category:
      id_expr: tbl_taxa_tree_families.family_id
      name_expr: tbl_taxa_tree_families.family_name
      data_type: integer
      operator: "="
    sort_expr: tbl_taxa_tree_families.family_name
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of analysis entities
      facet_key: result_facet
    sql:
      mode: inline-template
      contract: discrete
      base_anchor: analysis_entity
      body: |
        select
          tf.family_id as category_id,
          tf.family_name as category_name,
          ae.analysis_entity_id as anchor_id
        from facet.abundance_taxon_shortcut ats
        join tbl_taxa_tree_genera tg on tg.genus_id = ats.genus_id
        join tbl_taxa_tree_families tf on tf.family_id = tg.family_id
        join tbl_analysis_entities ae on ae.analysis_entity_id = ats.analysis_entity_id
        where {pick_filter_sql}
    clauses: []
    anchors:
      - anchor: analysis_entity
        mode: identity
      - anchor: dataset
        route: analysis_entity__dataset
        sql_override: |
          select
            tf.family_id as source_id,
            ds.dataset_id as target_id
          from facet.abundance_taxon_shortcut ats
          join tbl_taxa_tree_genera tg on tg.genus_id = ats.genus_id
          join tbl_taxa_tree_families tf on tf.family_id = tg.family_id
          join tbl_analysis_entities ae on ae.analysis_entity_id = ats.analysis_entity_id
          join tbl_datasets ds on ds.dataset_id = ae.dataset_id
          where {pick_filter_sql}
      - anchor: sample
        route: analysis_entity__sample

  - key: tbl_biblio_sample_groups
    display_title: Sample group bibliography
    description: Clause-bearing joined discrete driver demonstrating facet-owned SQL replacing indirect clause reconstruction
    group_key: bibliography
    type: discrete
    source_table: tbl_biblio
    category:
      id_expr: tbl_biblio.biblio_id
      name_expr: tbl_biblio.title
      data_type: integer
      operator: "="
    sort_expr: tbl_biblio.title
    flags:
      is_applicable: true
      is_default: false
    aggregate:
      type: count
      title: Number of samples
      facet_key: result_facet
    sql:
      mode: inline-template
      contract: discrete
      base_anchor: sample
      body: |
        select
          tbl_biblio.biblio_id as category_id,
          tbl_biblio.title as category_name,
          tbl_physical_samples.physical_sample_id as anchor_id
        from tbl_biblio
        join tbl_biblio_sample_groups on tbl_biblio_sample_groups.biblio_id = tbl_biblio.biblio_id
        join tbl_sample_group_sampling_contexts on tbl_sample_group_sampling_contexts.sampling_context_id = tbl_biblio_sample_groups.sampling_context_id
        join tbl_physical_samples on tbl_physical_samples.sample_group_id = tbl_sample_group_sampling_contexts.sample_group_id
        where {pick_filter_sql}
    clauses: []
    anchors:
      - anchor: sample
        mode: identity
      - anchor: dataset
        route: sample__dataset
      - anchor: sites
        route: sample__sites
      - anchor: analysis_entity
        route: sample__analysis_entity

# Queued Phase 3 Non-Discrete Drivers (not yet implemented):
#
# These facets are identified as required drivers for Phase 3 but are NOT included
# in Phase 1 scope. They will be added when Phase 3 extends inline SQL to non-discrete
# facet types (range, intersect, geopolygon).
#
# - geochronology: routed range driver for base-anchor template plus projection
#     type: range
#     purpose: prove range compiler with projected anchor support
#
# - tbl_denormalized_measured_values_33_0: denormalized or function-backed range driver
#     type: range
#     purpose: prove range compiler with denormalized source or UDF-backed content
#
# Restoration Drivers (already present above with updated descriptions):
#
# - analysis_entity_ages: intersect restoration driver
#     type: intersect
#     purpose: restore composed facet-content handling for range-intersection matching
#
# - sites_polygon: geopolygon restoration driver
#     type: geopolygon
#     purpose: restore composed facet-content handling for map-result targets
